<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/talentx.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TalentX - A modern MERN stack recruitment portal connecting students, colleges, and recruiters." />
    <meta name="keywords" content="job portal, placement, recruitment, students, careers, TalentX" />
    <title>TalentX - University Recruitment Portal</title>
  </head>
  <body>
    <script>
      (function () {
        var saved = localStorage.getItem("talentx-theme") || "system";
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var shouldDark = saved === "dark" || (saved === "system" && prefersDark);
        document.documentElement.classList.toggle("dark", shouldDark);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
